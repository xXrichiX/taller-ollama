# Monitoreo centralizado — Prometheus + Grafana
# Uso: docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
#
# Acceso (solo localhost en el VPS — usar túnel SSH desde tu Mac):
#   ssh -L 9090:127.0.0.1:9090 -L 3001:127.0.0.1:3001 root@TU_VPS
#   Prometheus: http://127.0.0.1:9090
#   Grafana:    http://127.0.0.1:3001  (admin + GRAFANA_ADMIN_PASSWORD del .env)

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in .env}
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  prometheus_data:
  grafana_data:
