name: Security checks

on:
  push:
    branches: [main, develop, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (pentest scripts)
        run: |
          bash -n scripts/pentest-selfcheck.sh
          bash -n scripts/pentest-master.sh

      - name: Python tests (chat scope)
        working-directory: iespro_taller
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py' -v
