name: Security checks

on:
  push:
    branches: [main, develop, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (security scripts)
        run: |
          bash -n scripts/pentest-selfcheck.sh
          bash -n scripts/pentest-master.sh
          bash -n scripts/backup-mysql.sh
          bash -n scripts/forensics-post-incident.sh

      - name: Python dependency audit
        working-directory: iespro_taller
        run: |
          python -m pip install --quiet pip-audit
          # Chroma embebido (PersistentClient); CVE aplica al servidor HTTP con trust_remote_code
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311

      - name: Python SAST (bandit)
        working-directory: iespro_taller
        run: |
          python -m pip install --quiet bandit
          bandit -r api services db -ll -q

      - name: Python tests (security suite)
        working-directory: iespro_taller
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Frontend dependency audit
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
