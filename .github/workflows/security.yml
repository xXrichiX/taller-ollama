name: Security checks

on:
  push:
    branches: [main, develop, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (deploy scripts)
        run: |
          bash -n scripts/backup-mysql.sh
          bash -n scripts/post-deploy-prod.sh
          bash -n scripts/setup-prod-env.sh

      - name: Python dependency audit
        working-directory: iespro_taller
        run: |
          python -m pip install --quiet pip-audit
          # Chroma embebido (PersistentClient); CVE aplica al servidor HTTP con trust_remote_code
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311

      - name: Python SAST (bandit)
        working-directory: iespro_taller
        run: |
          python -m pip install --quiet bandit
          bandit -r api services db -ll -q

      - name: Python tests (security suite)
        working-directory: iespro_taller
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest tests.test_input_validation tests.test_auth_profile -v

      - name: Red team IA (adversarial prompts)
        working-directory: iespro_taller
        run: |
          python -m unittest tests.test_redteam_ai -v

      - name: Frontend dependency audit
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
