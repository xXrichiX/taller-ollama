limit_req_zone $binary_remote_addr zone=api_general:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

map $http_user_agent $bad_bot {
    default 0;
    ~*(nikto|sqlmap|nmap|masscan|acunetix|nessus|dirbuster|gobuster|wpscan) 1;
}

map $request_uri $bad_uri {
    default 0;
    ~*(union\s+select|<script|\.env|/etc/passwd|\.\./) 1;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    if ($bad_bot) { return 403; }
    if ($bad_uri) { return 403; }

    # Evita falsos positivos del escáner (SPA catch-all devolvía HTML 200)
    location ~ /\. {
        return 404;
    }
    location = /.env { return 404; }
    location = /openapi.json { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location ~* ^/(phpinfo\.php|wp-admin|wp-login\.php)$ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/auth/login {
        client_max_body_size 1m;
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://backend:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/register {
        client_max_body_size 1m;
        limit_req zone=api_auth burst=3 nodelay;
        proxy_pass http://backend:8000/api/auth/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 8m;
        limit_req zone=api_general burst=80 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
