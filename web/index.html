<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IESPRO-Taller</title>
    <style>
      #app-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        background: #f4f6f8;
      }
      #app-boot .spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid #e5e7eb;
        border-top-color: #2185d0;
        animation: boot-spin 0.75s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot" aria-busy="true" aria-label="Cargando">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
